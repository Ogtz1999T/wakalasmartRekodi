<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOMBAY ENTERPRISES - Mfumo wa Uwakala</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

    <div class="max-w-4xl mx-auto pb-12">
        
        <!-- HEADER -->
        <header class="bg-blue-900 text-white p-4 shadow-md sticky top-0 z-50 flex justify-between items-center">
            <div>
                <h1 class="font-bold text-xl text-yellow-400">JOMBAY ENTERPRISES</h1>
                <p class="text-xs text-blue-200">Mfumo wa Uwakala wa Fedha na Benki</p>
            </div>
            <div id="userInfoHeader" class="hidden text-right">
                <span id="userBadge" class="bg-blue-800 text-yellow-300 text-xs px-2 py-1 rounded font-semibold block"></span>
                <button onclick="logout()" class="text-xs text-red-300 underline mt-1">Ondoka (Logout)</button>
            </div>
        </header>

        <main class="p-4">
            
            <!-- 1. LOGIN CARD -->
            <div id="loginCard" class="max-w-md mx-auto bg-white rounded-xl shadow-md p-6 mt-6 border">
                <h2 class="text-2xl font-bold text-slate-800 text-center mb-4">Ingia Kwenye Akaunti</h2>
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Username (Jina la Mtumiaji)</label>
                        <input type="text" id="loginUsername" class="w-full border rounded-lg p-2.5 text-sm outline-none" placeholder="Mfano: wakala1">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Password (Neno la Siri)</label>
                        <input type="password" id="loginPassword" class="w-full border rounded-lg p-2.5 text-sm outline-none" placeholder="Password">
                    </div>
                    <button type="button" onclick="handleLogin()" class="w-full bg-blue-900 hover:bg-blue-800 text-white font-semibold py-2.5 rounded-lg transition">Ingia (Login)</button>
                    
                    <div class="text-center pt-2">
                        <p class="text-xs text-slate-500 mb-1">Huna akaunti?</p>
                        <button type="button" onclick="showRegisterForm()" class="text-sm font-bold text-blue-90
